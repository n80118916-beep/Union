name: Build TusiClient

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 8
      uses: actions/setup-java@v4
      with:
        java-version: '8'
        distribution: 'temurin'

    # ХАК: Создаем локальный Maven-репозиторий и кладем туда мертвый файл
    - name: Setup Local Maven
      run: |
        mkdir -p ~/.m2/repository/net/minecraftforge/forge/1.12.2-14.23.5.2860
        curl -L -o ~/.m2/repository/net/minecraftforge/forge/1.12.2-14.23.5.2860/forge-1.12.2-14.23.5.2860-userdev.jar https://maven.cleanroommc.com/net/minecraftforge/forge/1.12.2-14.23.5.2860/forge-1.12.2-14.23.5.2860-userdev.jar
        echo "<project><modelVersion>4.0.0</modelVersion><groupId>net.minecraftforge</groupId><artifactId>forge</artifactId><version>1.12.2-14.23.5.2860</version></project>" > ~/.m2/repository/net/minecraftforge/forge/1.12.2-14.23.5.2860/forge-1.12.2-14.23.5.2860.pom

    - name: Setup Gradle 4.10.3
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '4.10.3'

    - name: Build with Gradle
      run: gradle build --stacktrace

    - name: Upload Jar
      uses: actions/upload-artifact@v4
      with:
        name: TusiClient-Jar
        path: build/libs/*.jar
