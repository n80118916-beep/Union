name: Build TusiClient

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 8
      uses: actions/setup-java@v4
      with:
        java-version: '8'
        distribution: 'temurin'

    # ХАК: Скачиваем мертвый файл с зеркала и кладем в кэш Gradle
    - name: Fix dead userdev link
      run: |
        mkdir -p ~/.gradle/caches/minecraft/net/minecraftforge/forge/1.12.2-14.23.5.2860
        curl -L -o ~/.gradle/caches/minecraft/net/minecraftforge/forge/1.12.2-14.23.5.2860/forge-1.12.2-14.23.5.2860-userdev.jar https://maven.cleanroommc.com/net/minecraftforge/forge/1.12.2-14.23.5.2860/forge-1.12.2-14.23.5.2860-userdev.jar

    - name: Setup Gradle 4.10.3
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '4.10.3'

    - name: Build with Gradle
      run: gradle build --stacktrace

    - name: Upload Jar
      uses: actions/upload-artifact@v4
      with:
        name: TusiClient-Jar
        path: build/libs/*.jar
