buildscript {
    repositories {
        maven { url = 'https://maven.anatawa12.com/' } // Форк, который чинит мертвые ссылки
        maven { url = 'https://maven.cleanroommc.com/' } // Зеркало со старыми библиотеками
        mavenCentral()
    }
    dependencies {
        classpath 'com.anatawa12.forge:ForgeGradle:2.3-1.0.+'
    }
}
apply plugin: 'net.minecraftforge.gradle.forge'

version = "1.0"
group = "ru.tusiclient"
archivesBaseName = "TusiClient"

sourceCompatibility = targetCompatibility = '1.8'

minecraft {
    version = "1.12.2-14.23.5.2860" // Берем последнюю версию
    runDir = "run"
    mappings = "stable_39" // Стабильные маппинги
}

processResources {
    inputs.property "version", project.version
    inputs.property "mcversion", project.minecraft.version
    from(sourceSets.main.resources.srcDirs) {
        include 'mcmod.info'
        expand 'version':project.version, 'mcversion':project.minecraft.version
    }
    from(sourceSets.main.resources.srcDirs) {
        exclude 'mcmod.info'
    }
}
